name: One-time compiled PDF

on:
  push:
    branches:
      - docs/add-compiled-pdf

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/add-compiled-pdf

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern

      - name: Compile manuscript
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error duistermaat_van_der_kallen_nonvanishing.tex
          test -s duistermaat_van_der_kallen_nonvanishing.pdf

      - name: Commit compiled PDF and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f duistermaat_van_der_kallen_nonvanishing.pdf
          git rm .github/workflows/compile-pdf-once.yml
          git commit -m "Add compiled preprint PDF"
          git push origin HEAD:docs/add-compiled-pdf
