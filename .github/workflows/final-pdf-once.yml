name: One-time final manuscript PDF

on:
  push:
    branches:
      - paper/final-scalar-gradient-transport

permissions:
  contents: write

jobs:
  build-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper/final-scalar-gradient-transport

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern

      - name: Compile and validate manuscript
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error duistermaat_van_der_kallen_nonvanishing.tex
          test -s duistermaat_van_der_kallen_nonvanishing.pdf
          ! grep -E "LaTeX Warning:.*undefined|There were undefined references|Citation .* undefined" duistermaat_van_der_kallen_nonvanishing.log

      - name: Commit PDF and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f duistermaat_van_der_kallen_nonvanishing.pdf
          git rm .github/workflows/final-pdf-once.yml
          git commit -m "Recompile finalized manuscript PDF"
          git push origin HEAD:paper/final-scalar-gradient-transport
